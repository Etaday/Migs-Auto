<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) the phone
         shell pads with is 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO. Add canonical, og:url and og:image once the domain is final. -->
    <title>Migs Auto - Cars and Motorcycles for Sale</title>
    <meta name="description" content="Migs Auto sells quality used and new cars and motorcycles. Browse the inventory, ask for a trade-in value, get financing or book a test drive." />
    <meta name="author" content="Migs Auto" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- The browser bar takes the page colour (--cream per theme); the inline
         theme script below and lib/theme.ts keep it in step with the toggle.
         Literal hex here only because this runs before any stylesheet loads. -->
    <meta name="theme-color" content="#0B0B0D" />
    <!-- <link rel="canonical" href="https://yoursite.com/" /> -->

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link rel="preload" as="image" href="/avatar.png" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share. og:image must be an absolute URL once you deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Migs Auto" />
    <meta property="og:title" content="Migs Auto - Cars and Motorcycles for Sale" />
    <meta property="og:description" content="Migs Auto sells quality used and new cars and motorcycles. Browse the inventory, ask for a trade-in value, get financing or book a test drive." />
    <!-- <meta property="og:url" content="https://yoursite.com/" /> -->
    <!-- <meta property="og:image" content="https://yoursite.com/share.png" /> -->
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoDealer",
        "name": "Migs Auto",
        "description": "Migs Auto sells quality used and new cars and motorcycles. Browse the inventory, ask for a trade-in value, get financing or book a test drive.",
        "telephone": "+63 000 000 0000",
        "areaServed": { "@type": "Country", "name": "Philippines" },
        "sameAs": []
      }
    </script>

    <!-- Theme before first paint: no flash of the wrong palette. Default is
         light; dark is the visitor's opt-in, persisted in localStorage. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#0B0B0D');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Migs Auto needs JavaScript to show this site. Please enable it.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
